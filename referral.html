<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087a3f">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/anabadelogo.jpeg" type="image/jpeg">
  <title>حساب المندوب | أنا بدي</title>
  <link rel="stylesheet" href="css/styles.css?v=7.3.0">
  <link rel="stylesheet" href="css/management.css?v=7.2.1">
  <link rel="stylesheet" href="css/redesign.css?v=8.0.0">
</head>
<body>
  <main class="site-shell">
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">أ</span><span class="brand-name">أنا بدي <small lang="en">Ana Bade</small></span></a><a class="back-link" href="index.html">الصفحة الرئيسية</a></header>
    <section class="inner-page management-page referral-page">
      <div class="management-heading"><p class="eyebrow">بوابة المندوب</p><h1>تسجيلاتك</h1><p>تابع الأشخاص والبزنس الذين سجلوا باستعمال رمزك.</p></div>
      <form id="referral-login" class="login-card">
        <h2>تسجيل الدخول</h2>
        <div class="field"><label for="referral-email">البريد الإلكتروني</label><input id="referral-email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="referral-password">كلمة المرور</label><input id="referral-password" type="password" required autocomplete="current-password"></div>
        <div class="submit-row"><button class="primary-button" type="submit">دخول</button><p id="referral-login-status" class="form-status" role="alert"></p></div>
      </form>
      <div id="referral-dashboard" class="hidden">
        <div class="admin-toolbar"><div><strong id="referral-name"></strong><p>رمزك: <b id="referral-code"></b></p></div><div class="item-actions"><button id="refresh-referral" class="plain-button" type="button">تحديث</button><button id="referral-logout" class="danger-button" type="button">تسجيل الخروج</button></div></div>
        <div class="providers-summary finance-summary"><article><span>إجمالي التسجيلات</span><strong id="referral-registrations-count">0</strong></article><article><span>مقبولة</span><strong id="referral-approved-count">0</strong></article><article><span>بانتظار المراجعة</span><strong id="referral-pending-count">0</strong></article><article><span>المدفوع لك</span><strong id="referral-paid-total">0.00 USD</strong></article></div>
        <section class="finance-section"><div class="section-toolbar"><div><h2>الأسماء المسجلة على رمزك</h2><p id="referral-results-count"></p></div><label class="compact-search"><span>بحث</span><input id="referral-search" type="search" placeholder="ابحث بالاسم أو الحالة"></label></div><div id="referral-registrations" class="finance-list"></div></section>
        <section class="finance-section"><div class="section-toolbar"><div><h2>الدفعات المسجلة لك</h2><p id="referral-payouts-count"></p></div></div><div id="referral-payouts" class="finance-list"></div></section>
      </div>
    </section>
  </main>
  <script type="module" src="js/referral.js?v=7.2.1"></script>
</body>
</html>
